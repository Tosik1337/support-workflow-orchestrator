<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="826" viewBox="0 0 1200 826" role="img" aria-labelledby="title desc">
  <title id="title">Support workspace capabilities</title>
  <desc id="desc">A conceptual map of support intake, operator decisions, integration boundaries, recorded status and human review. It illustrates product capabilities without implementation components or execution order.</desc>
  <defs>
    <style>text{font-family:Arial,Helvetica,sans-serif}.heading{fill:#12263a;font-size:34px;font-weight:700}.sub{fill:#53677b;font-size:18px}.label{fill:#12263a;font-size:24px;font-weight:700}.body{fill:#43596e;font-size:18px}.small{fill:#53677b;font-size:16px}.eyebrow{fill:#087e8b;font-size:16px;font-weight:700;letter-spacing:2px}</style>
  </defs>
  <rect width="1200" height="790" rx="24" fill="#f4f7fb"/>
  <text x="54" y="50" class="eyebrow">SUPPORT / CAPABILITY MAP</text>
  <text x="54" y="100" class="heading">A shared view of support work.</text>
  <text x="54" y="136" class="sub">People, requests and connected systems in one support workspace.</text>
  <rect x="54" y="191" width="1092" height="98" rx="16" fill="#12263a"/>
  <text x="82" y="231" fill="#fff" font-size="26" font-weight="700">Support workspace</text>
  <text x="82" y="263" fill="#dce8f1" font-size="18">A Telegram interface for handling incidents and understanding their status.</text>
  <rect x="54" y="330" width="330" height="137" rx="16" fill="#fff" stroke="#d8e2eb"/>
  <text x="80" y="376" class="label">Support intake</text>
  <text x="80" y="409" class="body">Incoming incidents</text>
  <text x="80" y="438" class="body">Relevant staff assignments</text>
  <rect x="435" y="330" width="330" height="137" rx="16" fill="#fff" stroke="#d8e2eb"/>
  <text x="461" y="376" class="label">Operator decisions</text>
  <text x="461" y="409" class="body">Ticket context</text>
  <text x="461" y="438" class="body">Role-controlled actions</text>
  <rect x="816" y="330" width="330" height="137" rx="16" fill="#fff" stroke="#d8e2eb"/>
  <text x="842" y="376" class="label">Integrations</text>
  <text x="842" y="409" class="body">Existing systems</text>
  <text x="842" y="438" class="body">Defined integration boundaries</text>
  <rect x="54" y="508" width="520" height="137" rx="16" fill="#e3f4f2" stroke="#82bfb9"/>
  <text x="80" y="554" class="label">Recorded status</text>
  <text x="80" y="587" class="body">Work and outcomes remain visible</text>
  <text x="80" y="616" class="body">Context for ongoing support</text>
  <rect x="626" y="508" width="520" height="137" rx="16" fill="#fff0d6" stroke="#e5cd9e"/>
  <text x="652" y="554" class="label">Human review</text>
  <text x="652" y="587" class="body">Uncertain work receives attention</text>
  <text x="652" y="616" class="body">Administrator judgment remains available</text>
  <text x="54" y="710" class="body">Conceptual capabilities only. Private implementation details are omitted.</text>
  <text x="54" y="756" class="small">Original illustration · neutral labels · source-reviewed capabilities · no running interface shown</text>
<g id="portfolio-copyright"><rect x="0" y="790" width="1200" height="36" fill="#ffffff"/><text x="32" y="813" style="fill:#536777;font:12px Segoe UI,Arial,sans-serif">© 2026 Anton Gorodnichiy · All rights reserved · Private implementation</text></g>
</svg>
