<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="756" viewBox="0 0 1200 756" role="img" aria-labelledby="title desc">
  <title id="title">Support visibility and human review</title>
  <desc id="desc">Three conceptual views help operators understand support work: work context, recorded outcomes and matters requiring human attention. The illustration contains no internal states, algorithms or execution sequence.</desc>
  <defs>
    <style>text{font-family:Arial,Helvetica,sans-serif}.heading{fill:#12263a;font-size:34px;font-weight:700}.sub{fill:#53677b;font-size:18px}.label{fill:#12263a;font-size:24px;font-weight:700}.body{fill:#43596e;font-size:18px}.small{fill:#53677b;font-size:16px}.eyebrow{fill:#087e8b;font-size:16px;font-weight:700;letter-spacing:2px}</style>
  </defs>
  <rect width="1200" height="720" rx="24" fill="#f4f7fb"/>
  <text x="54" y="50" class="eyebrow">SUPPORT / OPERATOR VISIBILITY</text>
  <text x="54" y="100" class="heading">Give people the context to make a decision.</text>
  <text x="54" y="136" class="sub">Clear status supports day-to-day work and review of interrupted incidents.</text>
  <rect x="54" y="198" width="330" height="281" rx="18" fill="#fff" stroke="#d8e2eb"/>
  <rect x="80" y="226" width="58" height="8" rx="4" fill="#12263a"/>
  <text x="80" y="286" class="label">Work context</text>
  <text x="80" y="331" class="body">The incident</text>
  <text x="80" y="365" class="body">The support assignment</text>
  <text x="80" y="399" class="body">Available operator decisions</text>
  <text x="80" y="450" class="small">Understand responsibility</text>
  <rect x="435" y="198" width="330" height="281" rx="18" fill="#e3f4f2" stroke="#82bfb9"/>
  <rect x="461" y="226" width="58" height="8" rx="4" fill="#087e8b"/>
  <text x="461" y="286" class="label">Recorded outcomes</text>
  <text x="461" y="331" class="body">Known work status</text>
  <text x="461" y="365" class="body">Available result information</text>
  <text x="461" y="399" class="body">Context beyond one message</text>
  <text x="461" y="450" class="small">Understand what is known</text>
  <rect x="816" y="198" width="330" height="281" rx="18" fill="#fff0d6" stroke="#e5cd9e"/>
  <rect x="842" y="226" width="58" height="8" rx="4" fill="#b17b2b"/>
  <text x="842" y="286" class="label">Human attention</text>
  <text x="842" y="331" class="body">Uncertain outcomes</text>
  <text x="842" y="365" class="body">Interrupted work</text>
  <text x="842" y="399" class="body">Administrator review</text>
  <text x="842" y="450" class="small">Understand what needs review</text>
  <rect x="54" y="531" width="1092" height="87" rx="15" fill="#e9eef5"/>
  <text x="80" y="566" class="body">Capability illustration with neutral concepts.</text>
  <text x="80" y="594" class="small">These are not internal state names, a recovery procedure or a screenshot of a running system.</text>
  <text x="54" y="680" class="small">Original illustration · source-reviewed capabilities · private implementation details omitted</text>
<g id="portfolio-copyright"><rect x="0" y="720" width="1200" height="36" fill="#ffffff"/><text x="32" y="743" style="fill:#536777;font:12px Segoe UI,Arial,sans-serif">© 2026 Anton Gorodnichiy · All rights reserved · Private implementation</text></g>
</svg>
